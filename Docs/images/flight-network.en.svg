<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Flight state synchronization flow</title>
  <desc id="desc">Control input reaches the flight calculation only for the user with control authority, then restores the remote environment through Udon flight state and VRCObjectSync</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c2937"/><stop offset="1" stop-color="#071925"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#103139"/><stop offset="1" stop-color="#09212a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      text{font-family:Inter,"Segoe UI",sans-serif}
      .title{fill:#f4eadb;font-size:36px;font-weight:700}.sub{fill:#a8b8b9;font-size:17px;font-weight:600}
      .cardTitle{fill:#f0ece3;font-size:26px;font-weight:700}.detail{fill:#bdc9c9;font-size:19px;font-weight:550}
      .condition{fill:#e5be7f;font-size:14px;font-weight:700}.branchTitle{fill:#f0ece3;font-size:22px;font-weight:700}
      .branchText{fill:#b4c1c1;font-size:19px;font-weight:550}
      @media (prefers-color-scheme:light){.title{fill:#173f50}.sub{fill:#586f76}}
    </style>
  </defs>

  <text x="54" y="66" class="title">Flight state sync — Owner authority and remote recovery</text>
  <text x="54" y="94" class="sub">Control authority gates the calculation before the state reaches remote users</text>

  <g filter="url(#shadow)">
    <rect x="36" y="136" width="226" height="198" rx="18" fill="url(#card)" stroke="#397488"/>
    <rect x="378" y="136" width="226" height="198" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="668" y="136" width="226" height="198" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="978" y="136" width="226" height="198" rx="18" fill="url(#card)" stroke="#397488"/>
  </g>

  <g transform="translate(60 184)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="6" r="4"/><path d="M16 10v12M7 22h18l2 7H5l2-7"/>
  </g>
  <text x="102" y="213" class="cardTitle">Control input</text>
  <text x="60" y="262" class="detail">VR hand motion</text><text x="60" y="291" class="detail">Desktop keys</text>

  <g transform="translate(402 184)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="24" height="28" rx="3"/><rect x="8" y="6" width="16" height="6" rx="1"/>
    <path d="M9 18h3M15 18h3M21 18h3M9 24h3M15 24h3M21 24h3"/>
  </g>
  <text x="444" y="213" class="cardTitle">Flight model</text>
  <text x="402" y="262" class="detail">Speed · attitude</text><text x="402" y="291" class="detail">World coordinates</text>

  <g transform="translate(692 184)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="3" fill="#dcb982" stroke="none"/><path d="M9 10a10 10 0 0 0 0 12M23 10a10 10 0 0 1 0 12M4 5a16 16 0 0 0 0 22M28 5a16 16 0 0 1 0 22"/>
  </g>
  <text x="734" y="213" class="cardTitle">State sync</text>
  <text x="692" y="262" class="detail">Udon flight state</text><text x="692" y="291" class="detail">VRCObjectSync</text>

  <g transform="translate(1002 184)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="30" height="23" rx="3"/>
    <path d="M10 31h12M16 25v6M16 7v11M11 13l5 5 5-5"/>
  </g>
  <text x="1044" y="213" class="cardTitle">Remote view</text>
  <text x="1002" y="262" class="detail">Rotation · altitude</text><text x="1002" y="291" class="detail">Position smoothing</text>

  <g fill="none" stroke="#78c9cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 235h16"/><path d="M276 228l8 7-8 7"/>
    <path d="M356 235h14"/><path d="M362 228l8 7-8 7"/>
    <path d="M616 235h40"/><path d="M648 228l8 7-8 7"/>
    <path d="M906 235h60"/><path d="M958 228l8 7-8 7"/>
  </g>
  <path d="M320 200l30 35-30 35-30-35z" fill="#0d2730" stroke="#6d7765" stroke-width="1.5"/>
  <text x="320" y="241" class="condition" text-anchor="middle">OWNER</text>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6">
    <path d="M781 334v43"/><path d="M1091 334v43"/>
  </g>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M774 369l7 8 7-8"/><path d="M1084 369l7 8 7-8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="647" y="390" width="268" height="112" rx="16" fill="#092431" stroke="#397488"/>
    <rect x="957" y="390" width="268" height="112" rx="16" fill="#14282d" stroke="#6d7765"/>
  </g>
  <g transform="translate(673 412)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3h7v18h-7M2 12h14M10 6l6 6-6 6"/>
  </g>
  <text x="711" y="430" class="branchTitle">Late join</text>
  <text x="673" y="466" class="branchText">Restore from the</text>
  <text x="673" y="490" class="branchText">current flight state</text>

  <g transform="translate(983 412)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 5a6 6 0 0 1-8 7l-7 7-4-4 7-7a6 6 0 0 1 7-7l-4 4 4 4z"/>
  </g>
  <text x="1021" y="430" class="branchTitle">Position correction</text>
  <text x="983" y="466" class="branchText">Smooth or snap based</text>
  <text x="983" y="490" class="branchText">on the position error</text>
</svg>
