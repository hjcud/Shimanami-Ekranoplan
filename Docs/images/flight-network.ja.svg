<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">飛行状態の同期フロー</title>
  <desc id="desc">操縦入力が操縦権を持つユーザーの飛行計算へ渡り、Udonの飛行状態とVRCObjectSyncを経てリモート環境へ復元される流れ。途中参加と位置誤差の補正は受信した状態から分岐する。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0a2d40"/><stop offset=".62" stop-color="#082233"/><stop offset="1" stop-color="#06131e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c2937"/><stop offset="1" stop-color="#071925"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#103139"/><stop offset="1" stop-color="#09212a"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#8fd4d7" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      text{font-family:"Noto Sans JP","Yu Gothic UI","Segoe UI",sans-serif}
      .title{fill:#f4eadb;font-size:36px;font-weight:700}.sub{fill:#a8b8b9;font-size:17px;font-weight:600}
      .cardTitle{fill:#f0ece3;font-size:26px;font-weight:700}.detail{fill:#bdc9c9;font-size:19px;font-weight:550}
      .condition{fill:#e5be7f;font-size:19px;font-weight:700}.branchTitle{fill:#f0ece3;font-size:22px;font-weight:700}
      .branchText{fill:#b4c1c1;font-size:19px;font-weight:550}
    </style>
  </defs>

  <rect x="16" y="16" width="1248" height="528" rx="28" fill="url(#background)"/>
  <path d="M146 16h112l154 528H292zM892 16h112l-138 528H744z" fill="#d1f7f4" fill-opacity=".035"/>
  <rect x="16" y="16" width="1248" height="528" rx="28" fill="url(#grid)"/>
  <rect x="16.5" y="16.5" width="1247" height="527" rx="27.5" fill="none" stroke="#73aeb9" stroke-opacity=".31"/>
  <path d="M46 17H270" stroke="#63bdc3" stroke-width="3"/><path d="M270 17H392" stroke="#d59b63" stroke-width="3"/>
  <text x="54" y="66" class="title">飛行状態の同期 — 所有者による計算とリモート復元</text>
  <text x="54" y="94" class="sub">操縦権を計算条件として分け、主要な処理を四つの段階に整理</text>

  <g filter="url(#shadow)">
    <rect x="48" y="136" width="244" height="198" rx="18" fill="url(#card)" stroke="#397488"/>
    <rect x="352" y="136" width="244" height="198" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="656" y="136" width="244" height="198" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="960" y="136" width="244" height="198" rx="18" fill="url(#card)" stroke="#397488"/>
  </g>

  <g transform="translate(76 168)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="30" height="20" rx="6"/><path d="M8 7v7M4.5 10.5h7M21 8h.1M25 12h.1"/>
  </g>
  <text x="76" y="224" class="cardTitle">操縦入力</text>
  <text x="76" y="262" class="detail">VRの手の動き</text><text x="76" y="291" class="detail">デスクトップ入力</text>

  <g transform="translate(380 166)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 24a15 15 0 1 1 28 0"/><path d="M15 15l8-7"/><circle cx="15" cy="15" r="2" fill="#dcb982" stroke="none"/>
  </g>
  <text x="380" y="224" class="cardTitle">飛行計算</text>
  <text x="380" y="262" class="detail">速度 · 姿勢</text><text x="380" y="291" class="detail">環境座標</text>

  <g transform="translate(684 163)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="15" cy="16" r="3" fill="#dcb982" stroke="none"/><path d="M8 10a10 10 0 0 0 0 12M22 10a10 10 0 0 1 0 12M3 5a16 16 0 0 0 0 22M27 5a16 16 0 0 1 0 22"/>
  </g>
  <text x="684" y="224" class="cardTitle">状態同期</text>
  <text x="684" y="262" class="detail">Udonの飛行状態</text><text x="684" y="291" class="detail">VRCObjectSync</text>

  <g transform="translate(988 165)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="31" height="22" rx="2"/><path d="M10 28h11M15.5 22v6"/>
  </g>
  <text x="988" y="224" class="cardTitle">リモート復元</text>
  <text x="988" y="262" class="detail">回転 · 高度を反映</text><text x="988" y="291" class="detail">水平位置を補間</text>

  <g fill="none" stroke="#78c9cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M304 235h34"/><path d="M330 228l8 7-8 7"/>
    <path d="M608 235h34"/><path d="M634 228l8 7-8 7"/>
    <path d="M912 235h34"/><path d="M938 228l8 7-8 7"/>
  </g>
  <g transform="translate(306 165)">
    <path d="M11 0a7 7 0 1 0 6.8 8.6H28v6h-5v5h-6v-5h-2.1" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="-1" y="44" class="condition">操縦権</text>
  </g>

  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6">
    <path d="M778 334v43"/><path d="M1082 334v43"/>
  </g>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M771 369l7 8 7-8"/><path d="M1075 369l7 8 7-8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="644" y="390" width="268" height="112" rx="16" fill="#092431" stroke="#397488"/>
    <rect x="948" y="390" width="268" height="112" rx="16" fill="#14282d" stroke="#6d7765"/>
  </g>
  <g transform="translate(670 417)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 8h19M12 1l7 7-7 7M25 0v16"/>
  </g>
  <text x="708" y="430" class="branchTitle">途中参加</text>
  <text x="670" y="466" class="branchText">受信した飛行状態から</text>
  <text x="670" y="490" class="branchText">環境を復元</text>

  <g transform="translate(974 416)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 3a8 8 0 0 1-10 10L3 22l-5-5 9-9A8 8 0 0 1 17-2l-5 5 5 5z"/>
  </g>
  <text x="1012" y="430" class="branchTitle">誤差補正</text>
  <text x="974" y="466" class="branchText">誤差の大きさに応じて</text>
  <text x="974" y="490" class="branchText">補間または即時補正</text>
</svg>
