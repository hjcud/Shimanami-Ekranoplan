<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">原点固定の飛行と同期の流れ</title>
  <desc id="desc">計算上の機体移動と逆方向に海や島を動かして機体と操縦席を原点に固定し、操縦入力から飛行計算、Udon状態同期とVRCObjectSync、リモート環境復元へつなぐ流れ</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0a2d40"/><stop offset=".62" stop-color="#082233"/><stop offset="1" stop-color="#06131e"/></linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d1f7f4" stop-opacity=".11"/><stop offset="1" stop-color="#63b8c4" stop-opacity="0"/></linearGradient>
    <linearGradient id="originPanel" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#092431"/><stop offset=".5" stop-color="#0b2934"/><stop offset="1" stop-color="#102b30"/></linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#8fd4d7" stroke-opacity=".045"/></pattern>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
    <style>text{font-family:"Noto Sans JP","Yu Gothic UI","Segoe UI",sans-serif}.title{fill:#f4eadb;font-size:34px;font-weight:750}.sub{fill:#91a5a8;font-size:14px;font-weight:600}.step{fill:#78bbb8;font-size:12px;font-weight:750}.ct{fill:#f0ece3;font-size:17px;font-weight:700}.cb{fill:#9faeb0;font-size:13px;font-weight:550}.tag{fill:#dcb982;font-size:12px;font-weight:700}.diagram{fill:#e9ece7;font-size:15px;font-weight:700}.diagram2{fill:#9faeb0;font-size:13px;font-weight:600}.foot{fill:#e9ece7;font-size:15px;font-weight:650}.foot2{fill:#93a5a7;font-size:12px;font-weight:550}</style>
  </defs>
  <rect x="16" y="16" width="1248" height="668" rx="28" fill="url(#panel)"/>
  <path d="M138 16h116l200 668H326zM528 16h86l88 668H580zM928 16h104L916 684H792z" fill="url(#ray)" opacity=".48"/>
  <rect x="16" y="16" width="1248" height="668" rx="28" fill="url(#grid)"/>
  <g fill="none" stroke="#9fe0e1" stroke-opacity=".18"><path d="M42 41c107-17 182 17 289 0s188 8 291-1 188-17 289 0 182 0 311-3"/><circle cx="1190" cy="90" r="5"/><circle cx="1170" cy="119" r="2.5"/><circle cx="93" cy="638" r="3.5"/></g>
  <rect x="16.5" y="16.5" width="1247" height="667" rx="27.5" fill="none" stroke="#73aeb9" stroke-opacity=".31"/><path d="M46 17H270" stroke="#63bdc3" stroke-width="3"/><path d="M270 17H392" stroke="#d59b63" stroke-width="3"/>
  <text x="54" y="68" class="title">原点固定の飛行と同期の流れ</text><text x="54" y="98" class="sub">計算上の機体移動と逆方向に環境を動かし、その状態を全ユーザーへ共有</text>

  <g filter="url(#shadow)"><rect x="48" y="120" width="1184" height="132" rx="17" fill="url(#originPanel)" stroke="#527d79" stroke-opacity=".9"/></g>
  <text x="72" y="149" class="step">原点固定構造</text>
  <g fill="none" stroke="#74b9b7" stroke-opacity=".22" stroke-linecap="round"><path d="M72 220c92-14 156 13 248 0s162 8 253 0 164-13 255 0 162 0 279-3"/><path d="M72 232c88-9 160 10 250 0s164 5 250 0 168-10 256 0 166 2 279-1"/></g>
  <path d="M1067 219c12-21 28-28 46-20 8-15 25-19 39-8 9-5 20-4 29 4l14 24z" fill="#577b72" fill-opacity=".28"/>
  <g fill="none" stroke="#7fc6c3" stroke-opacity=".48" stroke-width="1.5"><circle cx="640" cy="197" r="31"/><path d="M594 197h92M640 151v92"/></g><circle cx="640" cy="197" r="4" fill="#dcb982"/>
  <path d="M612 190l19-4 14-20 6 2-7 21 21 6v5l-21 6 7 21-6 2-14-20-19-4z" fill="#e9ece7" stroke="#7fc6c3" stroke-width="1.5" stroke-linejoin="round"/>
  <g fill="none" stroke="#dcb982" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M690 176h210"/><path d="M891 169l9 7-9 7"/></g>
  <g fill="none" stroke="#67b3b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M590 207H380"/><path d="M389 200l-9 7 9 7"/></g>
  <text x="720" y="158" class="diagram">計算上の機体移動 +Δ</text><text x="170" y="189" class="diagram">海 · 島 · 周辺環境</text><text x="170" y="215" class="diagram2">逆方向へ移動 −Δ</text><text x="690" y="218" class="diagram">機体 · 操縦席</text><text x="690" y="241" class="diagram2">ワールド原点 (0, 0, 0) に固定</text>

  <g filter="url(#shadow)">
    <rect x="48" y="280" width="208" height="235" rx="17" fill="#071a27" fill-opacity=".88" stroke="#397488"/><rect x="292" y="280" width="208" height="235" rx="17" fill="#071a27" fill-opacity=".88" stroke="#397488"/><rect x="536" y="280" width="208" height="235" rx="17" fill="#0a202a" fill-opacity=".9" stroke="#6d7765"/><rect x="780" y="280" width="208" height="235" rx="17" fill="#071a27" fill-opacity=".88" stroke="#6d7765"/><rect x="1024" y="280" width="208" height="235" rx="17" fill="#071a27" fill-opacity=".88" stroke="#397488"/>
  </g>
  <text x="70" y="313" class="step">入力</text><text x="70" y="350" class="ct">VR · デスクトップ</text><text x="70" y="385" class="cb">手の位置と回転</text><text x="70" y="410" class="cb">またはキー入力</text><text x="70" y="461" class="tag">出力 · ピッチ · ヨー · ロール</text>
  <text x="314" y="313" class="step">操縦権</text><text x="314" y="350" class="ct">操縦権を取得</text><text x="314" y="385" class="cb">操縦者を識別</text><text x="314" y="410" class="cb">状態オブジェクトの所有権</text><text x="314" y="461" class="tag">入力状態を渡す</text>
  <text x="558" y="313" class="step">飛行計算</text><text x="558" y="350" class="ct">飛行状態を計算</text><text x="558" y="385" class="cb">速度 · 抗力 · 揚力</text><text x="558" y="410" class="cb">姿勢制限 · 環境座標</text><text x="558" y="461" class="tag">状態を継続更新</text>
  <text x="802" y="313" class="step">同期</text><text x="802" y="350" class="ct">同期経路</text><text x="802" y="385" class="cb">Udonの飛行状態</text><text x="802" y="410" class="cb">マップ回転 · VRCObjectSync</text><text x="802" y="461" class="tag">状態と環境を共有</text>
  <text x="1046" y="313" class="step">リモート反映</text><text x="1046" y="350" class="ct">環境状態を復元</text><text x="1046" y="385" class="cb">回転と高度を適用</text><text x="1046" y="410" class="cb">水平位置を補間</text><text x="1046" y="461" class="tag">リモート画面へ反映</text>
  <g fill="none" stroke="#67b3b0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M263 405H285"/><path d="M278 398l7 7-7 7"/><path d="M507 405h22"/><path d="M522 398l7 7-7 7"/><path d="M751 405h22"/><path d="M766 398l7 7-7 7"/><path d="M995 405h22"/><path d="M1010 398l7 7-7 7"/></g>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"><path d="M884 515v18H572v10"/><path d="M1128 515v28"/></g>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M565 536l7 7 7-7"/><path d="M1121 536l7 7 7-7"/></g>
  <g transform="translate(48 550)">
    <rect width="572" height="116" rx="16" fill="#092431" stroke="#397488"/><text x="24" y="32" class="step">途中参加</text><text x="24" y="64" class="foot">共有された回転・高度・水平位置を適用</text><text x="24" y="90" class="foot2">参加時に現在の飛行状態から環境を復元</text>
    <rect x="612" width="572" height="116" rx="16" fill="#14282d" stroke="#6d7765"/><text x="636" y="32" class="step">誤差補正</text><text x="636" y="64" class="foot">位置差が大きくなると共有座標へ復元</text><text x="636" y="90" class="foot2">小さな誤差は滑らかに補間 · 大きな誤差は即時補正</text>
  </g>
</svg>
