<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
  <title id="title">비행 상태 동기화 흐름</title>
  <desc id="desc">조종 입력이 조종권을 가진 사용자의 비행 계산으로 전달되고, Udon 비행 상태와 VRCObjectSync를 거쳐 원격 환경에 복원되는 흐름. 중간 입장과 위치 오류 보정은 전달받은 상태에서 이어진다.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#0c2937"/><stop offset="1" stop-color="#071925"/>
    </linearGradient>
    <linearGradient id="activeCard" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#103139"/><stop offset="1" stop-color="#09212a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dy="7" stdDeviation="8" flood-color="#000" flood-opacity=".26"/>
    </filter>
    <style>
      text{font-family:Pretendard,"Noto Sans KR","Segoe UI",sans-serif}
      .title{fill:#f4eadb;font-size:36px;font-weight:700}.sub{fill:#a8b8b9;font-size:17px;font-weight:600}
      .cardTitle{fill:#f0ece3;font-size:26px;font-weight:700}.detail{fill:#bdc9c9;font-size:19px;font-weight:550}
      .condition{fill:#e5be7f;font-size:14px;font-weight:700}.branchTitle{fill:#f0ece3;font-size:22px;font-weight:700}
      .branchText{fill:#b4c1c1;font-size:19px;font-weight:550}
      @media (prefers-color-scheme:light){.title{fill:#173f50}.sub{fill:#586f76}}
    </style>
  </defs>

  <text x="54" y="66" class="title">비행 상태 동기화 — 소유자 계산과 원격 복원</text>
  <text x="54" y="94" class="sub">조종 권한을 계산 조건으로 분리하고 핵심 처리 단계를 네 개로 구성</text>

  <g filter="url(#shadow)">
    <rect x="36" y="136" width="226" height="172" rx="18" fill="url(#card)" stroke="#397488"/>
    <rect x="378" y="136" width="226" height="172" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="668" y="136" width="226" height="172" rx="18" fill="url(#activeCard)" stroke="#6d7765"/>
    <rect x="978" y="136" width="226" height="172" rx="18" fill="url(#card)" stroke="#397488"/>
  </g>

  <g transform="translate(60 174)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="6" r="4"/><path d="M16 10v12M7 22h18l2 7H5l2-7"/>
  </g>
  <text x="102" y="203" class="cardTitle">조종 입력</text>
  <text x="60" y="243" class="detail">VR 손 움직임</text><text x="60" y="272" class="detail">데스크톱 입력</text>

  <g transform="translate(402 174)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="2" width="24" height="28" rx="3"/><rect x="8" y="6" width="16" height="6" rx="1"/>
    <path d="M9 18h3M15 18h3M21 18h3M9 24h3M15 24h3M21 24h3"/>
  </g>
  <text x="444" y="203" class="cardTitle">비행 계산</text>
  <text x="402" y="243" class="detail">속도 · 자세</text><text x="402" y="272" class="detail">환경 좌표</text>

  <g transform="translate(692 174)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="3" fill="#dcb982" stroke="none"/><path d="M9 10a10 10 0 0 0 0 12M23 10a10 10 0 0 1 0 12M4 5a16 16 0 0 0 0 22M28 5a16 16 0 0 1 0 22"/>
  </g>
  <text x="734" y="203" class="cardTitle">상태 동기화</text>
  <text x="692" y="243" class="detail">Udon 비행 상태</text><text x="692" y="272" class="detail">VRCObjectSync</text>

  <g transform="translate(1002 174)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="30" height="23" rx="3"/>
    <path d="M10 31h12M16 25v6M16 7v11M11 13l5 5 5-5"/>
  </g>
  <text x="1044" y="203" class="cardTitle">원격 복원</text>
  <text x="1002" y="243" class="detail">회전 · 고도 적용</text><text x="1002" y="272" class="detail">수평 위치 보간</text>

  <g fill="none" stroke="#78c9cc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M268 222h17"/><path d="M277 215l8 7-8 7"/>
    <path d="M355 222h15"/><path d="M362 215l8 7-8 7"/>
    <path d="M616 222h40"/><path d="M648 215l8 7-8 7"/>
    <path d="M906 222h60"/><path d="M958 215l8 7-8 7"/>
  </g>
  <rect x="291" y="193" width="58" height="58" rx="10" fill="#0d2730" stroke="#6d7765" stroke-width="1.5"/>
  <text x="320" y="228" class="condition" text-anchor="middle">조종권</text>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6">
    <path d="M781 308v29"/><path d="M1091 308v29"/>
  </g>
  <g fill="none" stroke="#67b3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M774 329l7 8 7-8"/><path d="M1084 329l7 8 7-8"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="647" y="350" width="268" height="132" rx="16" fill="#092431" stroke="#397488"/>
    <rect x="957" y="350" width="268" height="132" rx="16" fill="#14282d" stroke="#6d7765"/>
  </g>
  <g transform="translate(673 372)" fill="none" stroke="#78c9cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3h7v18h-7M2 12h14M10 6l6 6-6 6"/>
  </g>
  <text x="711" y="390" class="branchTitle">중간 입장</text>
  <text x="673" y="426" class="branchText">현재 비행 상태에서</text>
  <text x="673" y="450" class="branchText">환경 복원</text>

  <g transform="translate(983 372)" fill="none" stroke="#dcb982" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 5a6 6 0 0 1-8 7l-7 7-4-4 7-7a6 6 0 0 1 7-7l-4 4 4 4z"/>
  </g>
  <text x="1021" y="390" class="branchTitle">오류 보정</text>
  <text x="983" y="426" class="branchText">오차 크기에 따라</text>
  <text x="983" y="450" class="branchText">보간 또는 즉시 보정</text>
</svg>
